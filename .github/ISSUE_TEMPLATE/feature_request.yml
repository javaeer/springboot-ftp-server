name: 💡 功能建议 / Feature Request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与动机 / Problem
      description: 当前有什么不便或缺失，促使你提出这个建议？
      placeholder: 例如：FTP 参数目前硬编码在源码中，修改需重新打包……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 你希望如何解决这个问题？
      placeholder: 例如：将端口 / 账号 / 密码 / 根目录改为 application.yml 配置项……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 是否考虑过其他实现方式？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、参考链接、相关 Issue 等。
    validations:
      required: false
